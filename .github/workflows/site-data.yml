name: site data

on:
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC
  workflow_dispatch: {}
  # No `push` trigger: this job commits its own output.

permissions:
  contents: write

concurrency:
  group: site-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch live GitHub data
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/site-data.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/site.json
          if git diff --quiet --staged; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore: refresh site data"
          git push